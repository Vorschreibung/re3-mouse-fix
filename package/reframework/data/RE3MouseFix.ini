[MouseFix]
; Camera fixes apply to both the normal and sight aiming cameras.
; Removes the nonlinear interpolation from the game's mouse response curve.
LinearizeInputCurve=1

; Sets the yaw and pitch camera damping time to zero.
RemoveCameraDamping=1

; Keeps horizontal sensitivity constant while looking up or down and aiming.
RemovePitchScaling=1

; Prevents mouse input from occasionally being multiplied by half-strength
; controller-stick state. This correction only runs in mouse/keyboard mode.
CorrectMouseMagnitude=1
